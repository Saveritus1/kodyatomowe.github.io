<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projekt atomowy V2</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            color: #ff3333;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            user-select: none;
            overflow: hidden;
            transition: background 0.5s ease;
        }

        h1 {
            font-size: 2.5rem;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 5px;
        }

        p {
            color: #cccccc;
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        /* Styl globalnego licznika */
        .licznik-kontener {
            font-size: 1.1rem;
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
            margin-bottom: 30px;
            border: 1px solid #00ff00;
            padding: 8px 15px;
            background-color: rgba(0, 50, 0, 0.4);
            border-radius: 5px;
        }

        .bomba-container {
            cursor: pointer;
            transition: transform 0.1s;
        }

        #bomba {
            font-size: 120px;
            display: block;
            filter: drop-shadow(0 0 15px #ff5500);
            transition: all 0.3s ease;
        }

        .drzenie {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(0px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(2px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(2px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }

        /* Animacja dynamicznego tła wybuchu (Grzyb atomowy i łuna) */
        .wybuch-tla {
            animation: nuclear-glow 4s ease-out forwards;
        }

        @keyframes nuclear-glow {
            0% { background-color: #ffffff; }
            5% { background-color: #ff3300; }
            15% { background-color: #ffcc00; }
            40% { background-color: #2b1100; }
            100% { background-color: #0d0500; }
        }

        /* Skalowanie grzyba atomowego po eksplozji */
        .grzyb-animacja {
            animation: grow-mushroom 3s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
        }

        @keyframes grow-mushroom {
            0% { transform: scale(0.3); filter: drop-shadow(0 0 50px #fff) brightness(5); }
            20% { transform: scale(1.2); filter: drop-shadow(0 0 40px #ff5500) brightness(1.5); }
            100% { transform: scale(1); filter: drop-shadow(0 0 20px #000); }
        }
    </style>
</head>
<body>

    <h1>PROTOKÓŁ INICJACYJNY</h1>
    
    <!-- Sekcja globalnego licznika z bazy danych -->
    <div class="licznik-kontener">
        ZDETONOWANO GLOBALNIE: <span id="globalny-licznik">Ładowanie...</span> RAZY
    </div>

    <p id="instrukcja">Uderz 3 razy w spację lub kliknij ładunek, aby uzbroić...</p>

    <div class="bomba-container" id="klikacz" onclick="zarejestrujAkcje()">
        <div id="bomba">💣</div>
    </div>

    <script>
        let licznik = 0;
        const wymaganeKlikniecia = 3;
        let uruchomiono = false;

        const instrukcjaTxt = document.getElementById('instrukcja');
        const bombaDiv = document.getElementById('bomba');
        const globalnyLicznikSpan = document.getElementById('globalny-licznik');

        // Unikalny klucz dla nowego API liczników (darmowe counterapi.dev)
        const countApiKey = "saveritus1_atom_v2";

        // Pobranie aktualnego stanu licznika z nowej bazy
        fetch(`https://counterapi.dev{countApiKey}/get`)
            .then(res => res.json())
            .then(data => {
                globalnyLicznikSpan.innerText = data.value || 0;
            })
            .catch(() => {
                // Jeśli klucz jeszcze nie istnieje, tworzymy go pierwszym zapytaniem
                fetch(`https://counterapi.dev{countApiKey}/create?value=0`)
                    .then(() => { globalnyLicznikSpan.innerText = "0"; })
                    .catch(() => { globalnyLicznikSpan.innerText = "0"; });
            });

        const dzwiekSyrenyURL = "syrena.mp3.mp3";
        const dzwiekWybuchuURL = "bum.mp3.mp3";

        const zdjeciaBitew = [
            { nazwa: "coś.jpg", url: "https://gstatic.com" },
            { nazwa: "bum.jpg", url: "https://gstatic.com" },
            { nazwa: "bitwa_3.jpg", url: "https://wikimedia.org" },
            { nazwa: "bitwa_4.jpg", url: "https://gstatic.com" },
            { nazwa: "bitwa_5.jpg", url: "https://gstatic.com" },
            { nazwa: "bitwa_6.jpg", url: "https://wikimedia.org" },
            { nazwa: "bitwa_7.jpg", url: "https://wikimedia.org" },
            { nazwa: "bitwa_8.jpg", url: "https://gstatic.com" },
            { nazwa: "bitwa_9.jpg", url: "https://gstatic.com" },
            { nazwa: "bitwa_10.jpg", url: "https://gstatic.com" }
        ];

        function zarejestrujAkcje() {
            if (uruchomiono) return;
            
            if (licznik < wymaganeKlikniecia) {
                licznik++;
                if (licznik === 1) bombaDiv.innerText = "🧨";
                if (licznik === 2) bombaDiv.innerText = "☢️";

                if (licznik === wymaganeKlikniecia) {
                    odliczanieAtomowe();
                }
            }
        }

        function odliczanieAtomowe() {
            uruchomiono = true;
            instrukcjaTxt.innerText = "UWAGA! ATAK POWIETRZNY! DETONACJA ZA 5 SEKUND...";
            bombaDiv.classList.add('drzenie');

            const syrena = new Audio(dzwiekSyrenyURL);
            syrena.play().catch(e => console.log("Interakcja wymagana!"));

            setTimeout(() => {
                syrena.pause();
                detonacja();
            }, 5000);
        }

        function detonacja() {
            instrukcjaTxt.innerText = "KATASTROFA ATOMOWA. Zrzut danych zakończony.";
            
            bombaDiv.innerText = "🍄"; 
            bombaDiv.classList.remove('drzenie');
            bombaDiv.classList.add('grzyb-animacja');
            
            document.body.classList.add('wybuch-tla');

            const wybuch = new Audio(dzwiekWybuchuURL);
            wybuch.play();

            // Zwiększenie licznika o +1 w nowej bazie po udanej detonacji
            fetch(`https://counterapi.dev{countApiKey}/hit`)
                .then(res => res.json())
                .then(data => {
                    globalnyLicznikSpan.innerText = data.value;
                });

            pobierzArchiwumZdjec();
        }

        function pobierzArchiwumZdjec() {
            zdjeciaBitew.forEach((zdjecie, index) => {
                setTimeout(() => {
                    const link = document.createElement('a');
                    link.href = zdjecie.url;
                    link.download = zdjecie.nazwa;
                    link.target = "_blank";
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                }, index * 300); 
            });
        }

        window.addEventListener('keydown', function(event) {
            if (event.code === 'Space') {
                event.preventDefault();
                zarejestrujAkcje();
            }
        });
    </script>
</body>
</html>
